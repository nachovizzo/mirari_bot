# Put this file in your repo at: .github/workflows/watch.yml
# Each run loops for ~5h45m checking every 3 min; a new run is queued every hour
# so there is always one waiting to take over (only one runs at a time).
name: Seat watcher
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: seat-watcher
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - run: |
          git config user.name bot
          git config user.email bot@users.noreply.github.com
          python watch.py
        env:
          EVENT_IDS: "527"
          INTERVAL: "180"
          RUN_MINUTES: "345"
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
