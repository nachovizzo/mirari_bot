# Put this file in your repo at: .github/workflows/watch.yml
name: Seat watcher
on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min (GitHub may delay a few minutes)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python watch.py
        env:
          EVENT_IDS: "527"
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      - name: Save last count
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add state.json
          git diff --cached --quiet || (git commit -m "update seats" && git push)
